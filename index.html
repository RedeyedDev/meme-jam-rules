<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meme Jam Rulebook</title>
<meta name="description" content="How Meme Jam works: the meme basketball card game in Telegram. Shots, combos, defense, clutch, modes, collection, Free Throw, Season Pass and fair play.">
<meta property="og:title" content="Meme Jam Rulebook">
<meta property="og:description" content="Meme basketball card game in Telegram: how a match works, what cards do, and where the prizes come from.">
<meta property="og:image" content="https://redeyeddev.github.io/meme-jam-rules/assets/logo.webp">
<meta name="theme-color" content="#140a1f">
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Display face = the game's: Lilita One for Latin, Nunito 800 for Cyrillic. */
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/lilita-one-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/lilita-one-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/nunito-800-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/nunito-800-cyrillic-ext.woff2') format('woff2');
    unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }

  :root {
    --bg: #140a1f; --bg2: #1e1030; --surface: #27173d; --surface2: #32204b; --line: #4a3566;
    --text: #fff6ee; --muted: #b9a8cc; --faint: #8a78a3;
    --action: #2ee6d6; --action-shadow: #157a70; --panel-shadow: 0 20px 40px rgba(0,0,0,.35);
    --court: #1b3a34; --court-line: rgba(255,246,238,.22);
    --orange: #ff7a1a; --orange-shadow: #b34e00; --teal: #2ee6d6; --teal-shadow: #157a70;
    --yellow: #ffd23f; --yellow-shadow: #b8940f; --red: #ff2d6b; --red-shadow: #a3153f;
    --green: #3ddc84; --purple: #7b2cff; --pink: #ff5fb0; --ink: #140a1f; --cream: #fff6ee;
    --frogs: #3ddc84; --dogs: #ffc233; --wojaks: #8fb3ff; --cats: #ff6fb5;
    --common: #a4a8b3; --rare: #3b82f6; --epic: #a855f7; --legendary: #f5c542;
    --hot: linear-gradient(135deg, #ff9a1f 0%, #ff3d5a 45%, #8a2be2 100%);
    --ring: conic-gradient(from 0deg,#ff3d5a,#ffd23f,#3ddc84,#2ee6d6,#7b2cff,#ff3d5a);
    --display: 'MJ Display', 'Lilita One', 'Nunito', sans-serif;
    --body: 'Nunito', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme='dark']) {
      --bg: #fff6ef; --bg2: #fdece0; --surface: #ffffff; --surface2: #e2fbf8; --line: #ead9cc;
      --text: #1d0f2c; --muted: #6b5a80; --faint: #7a6a90;
      --action: #0e9e91; --action-shadow: #0a6f66; --panel-shadow: 0 6px 20px rgba(29,15,44,.08);
      --court: #1f6f63; --court-line: rgba(255,246,238,.35);
    }
  }
  :root[data-theme='light'] {
    --bg: #fff6ef; --bg2: #fdece0; --surface: #ffffff; --surface2: #e2fbf8; --line: #ead9cc;
    --text: #1d0f2c; --muted: #6b5a80; --faint: #7a6a90;
    --action: #0e9e91; --action-shadow: #0a6f66; --panel-shadow: 0 6px 20px rgba(29,15,44,.08);
    --court: #1f6f63; --court-line: rgba(255,246,238,.35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 700 15px/1.55 var(--body); overflow-x: hidden; }
  a { color: var(--action); }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
  .disp { font-family: var(--display); font-weight: 800; letter-spacing: .5px; }
  .muted { color: var(--muted); }
  b, strong { font-weight: 800; }

  /* ── card (mirrors the in-game Card: family gradient, rarity frame, white edge, chip, rank) ── */
  :root { --w: 104px; }
  .card { --fc: var(--frogs); --rc: var(--common); position: relative; flex: none; width: var(--w); aspect-ratio: 5 / 7; font-size: calc(var(--w) / 10);
    border-radius: 1.15em; border: .3em solid var(--rc); overflow: hidden; user-select: none;
    background: radial-gradient(circle at 50% 30%, var(--fc) 0%, var(--fc) 45%, #27173d 120%);
    transition: transform .18s var(--out), box-shadow .18s var(--out), opacity .18s, filter .18s; }
  .card.frogs { --fc: var(--frogs); } .card.dogs { --fc: var(--dogs); } .card.wojaks { --fc: var(--wojaks); } .card.cats { --fc: var(--cats); }
  .card.rare { --rc: var(--rare); } .card.epic { --rc: var(--epic); } .card.legendary { --rc: var(--legendary); }
  .card.legendary::before { content: ''; position: absolute; inset: 0; background: repeating-conic-gradient(rgba(255,246,238,.16) 0 9deg, transparent 9deg 30deg); }
  .card.wild, .card.holo { border-color: transparent; background-origin: border-box; background-clip: padding-box, border-box; }
  .card.wild { background-image: var(--hot), var(--ring); }
  .card.holo { background-image: radial-gradient(circle at 50% 30%, var(--fc) 0%, var(--fc) 45%, #27173d 120%), var(--ring); }
  .card.gold { border-color: var(--yellow); box-shadow: inset 0 0 0 1px var(--yellow-shadow); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; pointer-events: none; }
  .card::after { content: ''; position: absolute; inset: 0; border: .19em solid #fff; border-radius: .85em; pointer-events: none; }
  .card .chip { position: absolute; top: .55em; left: .55em; width: 2.1em; height: 2.1em; border-radius: .65em; background: var(--fc); color: var(--ink); display: grid; place-items: center; font: 800 1.15em/1 var(--body); font-style: normal; box-shadow: 0 0 0 .12em rgba(20,10,31,.25); }
  .card .chip { font-size: 1.15em; width: 1.85em; height: 1.85em; border-radius: .55em; top: .5em; left: .5em; }
  .card .rank { position: absolute; right: .25em; bottom: .05em; font: 800 2.9em/1 var(--display); color: #fff; text-shadow: 0 0 .4em var(--rc), 0 .06em 0 rgba(20,10,31,.5); }
  .card .opp { position: absolute; top: .55em; right: .55em; width: 1.1em; height: 1.1em; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 .2em rgba(255,255,255,.9); }
  .card.back { border-color: #fff; background: var(--hot); }
  .card.back img { object-fit: cover; }

  /* ── hero ── */
  .hero { position: relative; background: var(--hot); color: var(--cream); overflow: hidden; padding: calc(14px + env(safe-area-inset-top)) 0 96px; }
  .hero svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .16; pointer-events: none; }
  .hero .wrap { position: relative; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--cream); }
  .brand img { height: 46px; width: auto; filter: drop-shadow(0 4px 0 rgba(20,10,31,.35)); }
  .brand span { font: 800 12px/1 var(--display); letter-spacing: 1.5px; opacity: .9; }
  .lang { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(20,10,31,.32); }
  .lang button { background: none; border: 0; border-radius: 9px; padding: 6px 10px; cursor: pointer; font: 800 12px/1 var(--display); letter-spacing: 1px; color: rgba(255,246,238,.75); }
  .lang button[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
  .hero-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px; margin-top: 34px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 10px; background: rgba(20,10,31,.32); font: 800 11px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; }
  .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px rgba(46,230,214,.3); }
  h1 { margin: 14px 0 12px; font: 800 clamp(40px, 8.4vw, 76px)/.95 var(--display); letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 6px 0 rgba(20,10,31,.35); }
  h1 em { font-style: normal; color: var(--yellow); }
  .hero p.lead { margin: 0; max-width: 520px; font-size: 16px; line-height: 1.5; color: rgba(255,246,238,.94); }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0 26px; border: 1.5px solid var(--yellow-shadow); border-radius: 18px; background: var(--yellow); color: var(--ink); cursor: pointer; text-decoration: none;
    font: 800 19px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase; box-shadow: 0 6px 0 var(--yellow-shadow); transition: transform .12s var(--out), box-shadow .12s var(--out); }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--yellow-shadow); }
  .btn.ghost { background: rgba(20,10,31,.32); color: var(--cream); border: 3px solid var(--cream); box-shadow: none; }
  .btn.orange { background: var(--orange); border-color: var(--orange-shadow); box-shadow: 0 6px 0 var(--orange-shadow); }
  .btn.orange:active { box-shadow: 0 1px 0 var(--orange-shadow); }
  .btn.teal { background: var(--teal); border-color: var(--teal-shadow); box-shadow: 0 6px 0 var(--teal-shadow); }
  .btn.teal:active { box-shadow: 0 1px 0 var(--teal-shadow); }
  .btn.sm { height: 44px; padding: 0 18px; font-size: 15px; border-radius: 14px; box-shadow: 0 4px 0 var(--yellow-shadow); }
  .btn.plain, .btn.plain:active { background: none; color: var(--text); border: 2px solid var(--line); box-shadow: none; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }

  .fan { position: relative; width: 380px; height: 300px; flex: none; }
  .fan .card { --w: 150px; position: absolute; left: 50%; bottom: 14px; margin-left: -75px; transform-origin: 50% 100%; box-shadow: 0 12px 0 rgba(20,10,31,.28); animation: fanIn .9s var(--spring) both; transform: translate(var(--x), var(--y)) rotate(var(--rot)); }
  .fan .card:nth-child(1) { --x: -112px; --y: 16px; --rot: -18deg; animation-delay: .05s; } .fan .card:nth-child(2) { --x: -58px; --y: 2px; --rot: -9deg; animation-delay: .12s; z-index: 1; }
  .fan .card:nth-child(3) { --x: 0px; --y: -6px; --rot: 0deg; animation-delay: .19s; z-index: 2; } .fan .card:nth-child(4) { --x: 58px; --y: 2px; --rot: 9deg; animation-delay: .26s; z-index: 1; }
  .fan .card:nth-child(5) { --x: 112px; --y: 16px; --rot: 18deg; animation-delay: .33s; }
  .fan .card:hover { transform: translate(var(--x), calc(var(--y) - 18px)) rotate(var(--rot)); z-index: 3; }
  @keyframes fanIn { from { transform: translateY(60px) scale(.6); opacity: 0; } }
  .ballfx { position: absolute; right: -8px; top: -6px; width: 74px; height: 74px; animation: bob 4s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(20,10,31,.3)); z-index: 4; }
  @keyframes bob { 50% { transform: translateY(-12px) rotate(18deg); } }

  /* ── stat strip + nav ── */
  .strip { position: relative; margin-top: -58px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px 16px; box-shadow: var(--panel-shadow); min-width: 0; }
  .stat b { display: block; font: 800 34px/1 var(--display); letter-spacing: .5px; background: var(--hot); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat span { display: block; margin-top: 5px; font: 800 11px/1.25 var(--display); letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }
  nav.toc { position: sticky; top: 0; z-index: 20; margin-top: 18px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  nav.toc .wrap { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
  nav.toc .wrap::-webkit-scrollbar { display: none; }
  nav.toc a { flex: none; padding: 8px 12px; border-radius: 12px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font: 800 12px/1 var(--display); letter-spacing: 1.1px; text-transform: uppercase; transition: background .15s, color .15s; }
  nav.toc a:hover, nav.toc a.on { background: var(--action); color: var(--ink); border-color: var(--action-shadow); }

  /* ── sections ── */
  section { padding-top: 54px; }
  .kicker { display: inline-block; padding: 5px 10px; border-radius: 10px; background: var(--hot); color: var(--cream); font: 800 11px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; }
  h2 { margin: 12px 0 8px; font: 800 clamp(28px, 5.4vw, 44px)/1 var(--display); letter-spacing: 1px; text-transform: uppercase; }
  .sub { margin: 0 0 20px; max-width: 680px; color: var(--muted); font-size: 15.5px; }
  h3 { margin: 0 0 6px; font: 800 17px/1.15 var(--display); letter-spacing: .8px; text-transform: uppercase; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--panel-shadow); min-width: 0; }
  .panel p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .panel p + p { margin-top: 8px; }
  .panel p b { color: var(--text); }
  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .rise { opacity: 0; transform: translateY(18px); transition: opacity .55s var(--out), transform .55s var(--out); }
  .rise.in { opacity: 1; transform: none; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); font: 800 10.5px/1.1 var(--display); letter-spacing: 1px; text-transform: uppercase; }
  .tag.t { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--action); border-color: color-mix(in srgb, var(--action) 45%, transparent); }
  .tag.y { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: color-mix(in srgb, var(--yellow) 70%, var(--text)); border-color: color-mix(in srgb, var(--yellow) 55%, transparent); }
  .tag.r { background: color-mix(in srgb, var(--red) 16%, transparent); color: color-mix(in srgb, var(--red) 80%, var(--text)); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  /* ── steps ── */
  .step { position: relative; overflow: hidden; padding-top: 16px; }
  .step .n { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font: 800 26px/1 var(--display); color: var(--ink); background: var(--c); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, #000); transform: rotate(-6deg); margin-bottom: 14px; }
  .step::after { content: attr(data-n); position: absolute; right: -6px; bottom: -34px; font: 800 130px/1 var(--display); color: var(--text); opacity: .05; pointer-events: none; }

  /* ── demo court ── */
  .demo { border-width: 2px; padding: 0; overflow: hidden; }
  .demo-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--ink); color: var(--cream); }
  .demo-top .sc { display: flex; align-items: baseline; gap: 8px; font: 800 15px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase; }
  .demo-top .sc b { font-size: 34px; color: var(--yellow); min-width: 44px; display: inline-block; }
  .demo-top .q { display: flex; gap: 5px; align-items: center; font: 800 12px/1 var(--display); letter-spacing: 1.2px; }
  .demo-top .q i { width: 26px; height: 8px; border-radius: 4px; background: rgba(255,246,238,.2); overflow: hidden; }
  .demo-top .q i s { display: block; height: 100%; background: var(--teal); transition: width .3s; }
  .courtbox { position: relative; background: var(--court); padding: 30px 12px 16px; }
  .courtbox svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lanes { position: relative; display: grid; grid-template-columns: repeat(5, auto); justify-content: center; gap: clamp(4px, 1.5vw, 18px); }
  .lane { --w: clamp(46px, 15.6vw, 112px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lane .pos { font: 800 12px/1 var(--display); letter-spacing: 1.5px; color: rgba(255,246,238,.75); }
  .stack { position: relative; width: var(--w); height: calc(var(--w) * 1.4 + var(--w) * .36); }
  .stack .card { position: absolute; left: 0; bottom: 0; }
  .stack .card.p1 { bottom: calc(var(--w) * .18); transform: scale(.94); filter: brightness(.72); z-index: 1; }
  .stack .card.p2 { bottom: calc(var(--w) * .36); transform: scale(.88); filter: brightness(.5); z-index: 0; }
  .stack .card.top { z-index: 2; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
  .stack .card.top:hover { transform: translateY(-4px); }
  .stack .card.sel { transform: translateY(-12px) !important; box-shadow: 0 0 0 3px var(--teal), 0 14px 0 rgba(0,0,0,.3); }
  .stack .card.ok { box-shadow: 0 0 0 3px rgba(46,230,214,.6), 0 6px 0 rgba(0,0,0,.3); animation: pulse 1.2s ease-in-out infinite; }
  .stack .card.no { opacity: .45; filter: saturate(.2); }
  .stack .card.in { animation: deal .4s var(--spring) both; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(46,230,214,.25), 0 6px 0 rgba(0,0,0,.3); } }
  @keyframes deal { from { transform: translateY(-30px) scale(.7); opacity: 0; } }
  .stack .empty { position: absolute; left: 0; bottom: 0; width: var(--w); aspect-ratio: 5/7; border: 2px dashed var(--court-line); border-radius: 12px; }
  .lane .left { font: 800 11px/1 var(--display); letter-spacing: 1px; color: rgba(255,246,238,.55); }
  .demo-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
  .shot b { display: block; font: 800 24px/1 var(--display); letter-spacing: 1px; text-transform: uppercase; }
  .shot span { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .outcome { padding: 0 16px 16px; }
  .outcome:empty { display: none; }
  .duels { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pair { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); animation: riseIn .35s var(--out) both; }
  .pair .card { --w: 44px; } .pair .card .rank { font-size: 3.4em; }
  .pair .vs { font: 800 12px/1 var(--display); color: var(--faint); }
  .def { width: 44px; height: 62px; border-radius: 8px; border: 2.5px solid var(--red); background: var(--surface); display: grid; place-items: center; align-content: center; gap: 3px; font: 800 10px/1 var(--display); color: var(--red); }
  .def i { width: 18px; height: 18px; border-radius: 5px; background: var(--fc); color: var(--ink); display: grid; place-items: center; font: 800 10px/1 var(--body); font-style: normal; }
  .def.ref { border-color: var(--yellow); color: var(--yellow); }
  .pair .res { padding: 4px 7px; border-radius: 8px; font: 800 10.5px/1 var(--display); letter-spacing: 1px; text-transform: uppercase; }
  .pair .res.open { background: var(--teal); color: var(--ink); } .pair .res.blk { background: var(--red); color: var(--cream); } .pair .res.cl { background: var(--yellow); color: var(--ink); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } }
  .stamp { display: inline-block; margin-top: 12px; padding: 10px 16px; border-radius: 14px; font: 800 24px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; transform: rotate(-3deg); animation: stamp .45s var(--spring) both; animation-delay: .35s; }
  .stamp.good { background: var(--teal); color: var(--ink); box-shadow: 0 5px 0 var(--teal-shadow); }

  /* ── combo tiles, bars ── */

  .gauge div { position: relative; height: 22px; border-radius: 11px; background: linear-gradient(90deg, #ff2d6b 0 22%, #ffd23f 22% 40%, #2ee6d6 40% 60%, #ffd23f 60% 78%, #ff2d6b 78%); box-shadow: inset 0 0 0 3px rgba(20,10,31,.55); }

let io;
function observe() {
  io?.disconnect();
  io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.rise').forEach((el) => io.observe(el));
}
const navIo = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  document.querySelectorAll('#toc a').forEach((a) => {
    const on = a.getAttribute('href') === '#' + e.target.id;
    a.classList.toggle('on', on);
    if (on) { const bar = $('toc'); bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 2 + a.clientWidth / 2, behavior: 'smooth' }); }
  });
}), { rootMargin: '-35% 0px -60% 0px' });
SECTIONS.forEach((id) => navIo.observe($(id)));

function deal() {
  const pool = [];
  for (const f of FAMS) for (const r of RANKS) { pool.push({ f, r }); pool.push({ f, r, opp: true }); }
  pool.push({ f: 'wild' }, { f: 'wild', skin: 'me_gusta' });
  const cards = shuffle(pool).slice(0, 45);
  demo.lanes = [0, 1, 2, 3, 4].map((i) => cards.slice(i * 9, i * 9 + 9));
  Object.assign(demo, { sel: [], score: 0, taken: 0, bench: [], out: null, fresh: true });
}
function drawBench(n) {
  if (demo.bench.length < n) { demo.bench = shuffle([...FAMS.flatMap((f) => [f, f, f, f]), 'ref', 'ref']); }
  return demo.bench.splice(0, n);
}
const topOf = (i) => demo.lanes[i][0];
const comboFam = () => demo.sel.map(topOf).find((c) => c.f !== 'wild')?.f ?? null;
const fits = (i) => { const c = topOf(i); const f = comboFam(); return !!c && !demo.sel.includes(i) && demo.sel.length < 4 && (c.f === 'wild' || !f || c.f === f); };

function drawDemo() {
  const left = demo.lanes.reduce((s, l) => s + l.length, 0);
  $('dScore').textContent = demo.score;
  const q = Math.min(4, Math.floor(demo.taken / 11) + 1);
  $('dQ').innerHTML = [1, 2, 3, 4].map((n) => `<i><s style="width:${n < q ? 100 : n > q ? 0 : left ? ((demo.taken - (q - 1) * 11) / (q === 4 ? 12 : 11)) * 100 : 100}%"></s></i>`).join('') + `<span>Q${q}</span>`;
  $('lanes').innerHTML = demo.lanes.map((lane, i) => {
    const sel = demo.sel.includes(i);
    const st = !lane.length ? '' : sel ? 'sel' : demo.sel.length ? (fits(i) ? 'ok' : 'no') : '';
    return `<div class="lane"><span class="pos">${POS[i]}</span><div class="stack">`
      + (lane.length ? '' : '<div class="empty"></div>')
      + (lane[2] ? card(lane[2], 'p2') : '') + (lane[1] ? card(lane[1], 'p1') : '')
      + (lane[0] ? card(lane[0], `top ${st} ${demo.fresh ? 'in' : ''}`, `data-lane="${i}" role="button" tabindex="0" aria-label="${cardName(lane[0])}" style="animation-delay:${i * 60}ms"`) : '')
      + `</div><span class="left">×${lane.length}</span></div>`;
  }).join('');
  demo.fresh = false;
  const n = demo.sel.length;
  $('dShoot').disabled = !n;
  if (!left) { $('dShot').textContent = t('dOver'); $('dHint').textContent = t('dOverHint'); }
  else if (!n) { $('dShot').textContent = t('dPick'); $('dHint').textContent = t('dPickHint'); }
  else {
    $('dShot').textContent = `${SHOTS[n]} · ${n + 1} ${t('pts')}`;
    const more = [0, 1, 2, 3, 4].some(fits);
    $('dHint').textContent = n === 4 ? t('dHintMax') : more ? t('dHintMore') : n === 1 ? t('dHintSolo') : t('dHintMax');
  }
  renderOut();
}
function renderOut() {
  const o = demo.out;
  if (!o) { $('dOut').innerHTML = ''; return; }
  const pairs = o.rows.map((r, i) => `<div class="pair" style="animation-delay:${i * 90}ms">${card(r.c)}<span class="vs">VS</span>`
    + `<div class="def ${r.d === 'ref' ? 'ref' : ''}" style="--fc:var(--${r.d === 'ref' ? 'yellow' : r.d})">${r.d === 'ref' ? 'REF' : `<i>${LETTER[r.d]}</i>DEF`}</div>`
    + `<span class="res ${r.clutch ? 'cl' : r.blocked ? 'blk' : 'open'}">${r.clutch ? t('rClutch') : r.blocked ? t('rBlk') : t('rOpen')}</span></div>`).join('');
  const stamp = o.kind === 'open' ? `<span class="stamp good">${t('rScore', { n: o.pts })}</span>` : o.kind === 'clutch' ? `<span class="stamp clutch">${t('rClutchScore', { n: o.pts })}</span>` : `<span class="stamp bad">${t('rBlocked')}</span>`;
  const why = o.kind === 'open' ? t('yOpen') : o.kind === 'clutch' ? t('yClutch', { card: cardName(o.hero), p: CLUTCH[rarOf(o.hero)] }) : o.canClutch ? t('yBlockedOwn') : t('yBlockedNone');
  $('dOut').innerHTML = `<div class="duels">${pairs}</div>${stamp}<p class="why">${why}</p>`;
}
function tapLane(i) {
  if (!topOf(i)) return;
  demo.out = null;
  if (demo.sel.includes(i)) demo.sel = demo.sel[0] === i ? [] : demo.sel.filter((x) => x !== i);
  else if (fits(i)) demo.sel.push(i);
  else demo.sel = [i];
  drawDemo();
}
function shoot() {
  const n = demo.sel.length;
  if (!n) return;
  const defs = drawBench(n);
  const rows = demo.sel.map((i, k) => { const c = topOf(i); return { c, d: defs[k], blocked: defs[k] === 'ref' || defs[k] === c.f || false }; });
  rows.forEach((r) => { if (r.c.f === 'wild' && r.d !== 'ref') r.blocked = r.d === comboFam(); });
  let kind = rows.some((r) => !r.blocked) ? 'open' : 'blocked';
  let hero = null;
  const own = rows.filter((r) => !r.c.opp && CLUTCH[rarOf(r.c)] > 0);
  if (kind === 'blocked') for (const r of own) if (Math.random() * 100 < CLUTCH[rarOf(r.c)]) { r.clutch = true; hero = r.c; kind = 'clutch'; break; }
  const pts = n + 1;
  if (kind !== 'blocked') demo.score += pts;
  demo.out = { rows, kind, pts, hero, canClutch: own.length > 0 };
  demo.sel.forEach((i) => demo.lanes[i].shift());
  demo.taken += n;
  demo.sel = [];
  drawDemo();
}
$('lanes').addEventListener('click', (e) => { const el = e.target.closest('[data-lane]'); if (el) tapLane(+el.dataset.lane); });
$('lanes').addEventListener('keydown', (e) => { const el = e.target.closest('[data-lane]'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tapLane(+el.dataset.lane); } });
$('dShoot').addEventListener('click', shoot);
$('dReset').addEventListener('click', () => { deal(); drawDemo(); });

document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('mj.rules.lang', lang); } catch {}
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  render();
}));

deal();
render();
</script>
</body>
</html>
